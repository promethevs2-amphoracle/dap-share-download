<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The share folder's icon: a dark folder with a neon tab and the mark, drawn as in app-icon.svg:
       the stem of the d rises on the right, the other falls on the left, and both fade out.
       Set on ~/DAP-Share by `start` on macOS. -->
  <defs>
    <linearGradient id="gp" gradientUnits="userSpaceOnUse" x1="0" y1="66" x2="0" y2="110"><stop offset="0" stop-color="#39FF14"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></linearGradient>
    <linearGradient id="gd" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="0" y2="-10"><stop offset="0" stop-color="#39FF14"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></linearGradient>
    <clipPath id="front"><rect x="36" y="178" width="440" height="262" rx="30"/></clipPath>
  </defs>
  <path d="M52 130q0-26 26-26h118q15 0 24 13l17 25h197q26 0 26 26v232H52z" fill="#39FF14"/>
  <rect x="36" y="178" width="440" height="262" rx="30" fill="#0A0B0F"/>
  <g clip-path="url(#front)">
    <g transform="translate(256 309) scale(2.18) translate(-50 -50)">
      <rect x="24.5" y="24.5" width="16" height="115.5" fill="url(#gp)"/>
      <rect x="59.5" y="-40" width="16" height="115.5" fill="url(#gd)"/>
      <circle cx="50" cy="50" r="25.5" fill="#39FF14"/>
      <rect x="24.5" y="24.5" width="16" height="25.5" fill="#39FF14"/>
      <rect x="59.5" y="50" width="16" height="25.5" fill="#39FF14"/>
      <rect x="41.5" y="43" width="4.5" height="10" rx="1.2" fill="#0A0B0F"/>
      <rect x="54" y="43" width="4.5" height="10" rx="1.2" fill="#0A0B0F"/>
    </g>
  </g>
  <rect x="36" y="178" width="440" height="262" rx="30" fill="none" stroke="#39FF14" stroke-width="7"/>
</svg>
